name: AIDA Flotte scannen

on:
  schedule:
    - cron: '*/10 * * * *' # Läuft alle 10 Minuten (kostenlos bei Public-Repo)
  workflow_dispatch:

concurrency:
  group: aida-flotte-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install ws
      - run: node scan.js
        env:
          AIS_API_KEY: ${{ secrets.AIS_API_KEY }}
